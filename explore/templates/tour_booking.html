<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Бронирование — {{ tour.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <section class="py-5">
        <div class="container" style="max-width: 600px;">
            <h1 class="mb-4">Бронирование: {{ tour.title }}</h1>

            {% if errors %}
                <div class="alert alert-danger">
                    <ul class="mb-0">
                        {% for error in errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}

            <form method="post">
                <div class="mb-3">
                    <label for="surname" class="form-label">Фамилия</label>
                    <input type="text" class="form-control" id="surname"
                           name="surname" value="{{ form.surname or '' }}" required>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label">Имя</label>
                    <input type="text" class="form-control" id="name"
                           name="name" value="{{ form.name or '' }}" required>
                </div>

                <div class="mb-3">
                    <label for="middle_name" class="form-label">Отчество</label>
                    <input type="text" class="form-control" id="middle_name"
                           name="middle_name" value="{{ form.middle_name or '' }}">
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Телефон</label>
                    <input type="tel" class="form-control" id="phone"
                           name="phone" value="{{ form.phone or '' }}"
                           placeholder="+7 (999) 123-45-67" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email (необязательно)</label>
                    <input type="email" class="form-control" id="email"
                           name="email" value="{{ form.email or '' }}">
                </div>

                <button type="submit" class="btn btn-primary">Отправить заявку</button>
                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                    Назад
                </a>
            </form>
        </div>
    </section>
</body>
</html>
