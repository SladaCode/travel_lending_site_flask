<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заявка принята — Explore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-thanks {
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-thanks::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
        }

        .hero-thanks .content {
            position: relative;
            z-index: 1;
            color: #fff;
            text-align: center;
            max-width: 700px;
            padding: 2rem;
        }

        .hero-thanks h1 {
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        .hero-thanks p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            margin-bottom: 2rem;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
        }

        .hero-thanks .btn {
            padding: 0.75rem 2rem;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<section class="hero-thanks" style="background-image: url({{ url_for('static', filename='image/' ~ tour.image) }});">
    <div class="content">
        <h1>Заявка принята!</h1>
        <p>Менеджер свяжется с вами в течение 5 минут.</p>
        <a href="{{ url_for('index') }}" class="btn btn-light">
            На главную
        </a>
    </div>
</section>

</body>
</html>
